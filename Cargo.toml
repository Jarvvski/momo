[package]
name = "momo-cli"
description = "A standalone, monorepo-aware CLI that turns a project's accumulated changes into semver releases, a changelog, and VCS tags"
version = "0.7.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jarvvski/momo"
readme = "README.md"
keywords = ["semver", "changelog", "release", "versioning", "monorepo"]
categories = ["command-line-utilities", "development-tools"]
# The project pins its toolchain in mise.toml; this is the version the suite is
# verified against, not a hand-computed minimum.
rust-version = "1.99"
# Keep the published crate to what a `cargo install` consumer needs: planning
# notes, CI config, the logo, and the docs the README links to are not part of
# the binary.
exclude = [
  ".agents/",
  ".claude/",
  ".github/",
  ".momo/",
  ".scratch/",
  "assets/",
  "docs/",
  "AGENTS.md",
  "CLAUDE.md",
  "CODE_OF_CONDUCT.md",
  "GLOSSARY.md",
  "SECURITY.md",
  "mise.toml",
  "momo.toml",
  "skills-lock.json",
]

[[bin]]
name = "momo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
# Shell completion generation, from the same clap tree the parser uses, so the
# script cannot drift from the command surface.
clap_complete = "4"
# A safe wrapper around `kill(2)`: the timeout must stop the child's whole
# process group, and `unsafe` is forbidden crate-wide, so the group signal
# cannot be issued through a raw libc call.
rustix = { version = "1.1", features = ["process", "std"] }
semver = { version = "1.0", features = ["serde"] }
# The reporting shapes derive `Serialize`; `semver`'s `serde` feature above
# renders a Version as its string form, as the JSON contract documents.
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = "0.3"
toml_edit = "0.25"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

# Keep local development and test artifacts small. Release builds are used by
# the normal mise run/build tasks, while tests retain their separate profile.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

# Release binaries are shipped as tarballs, so favour a small, fast artefact:
# strip the symbols, thin-LTO across the crate, and one codegen unit for the
# best cross-unit optimisation. The build-time cost is paid once per release.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
