[package]
name = "momo-cli"
description = "A standalone, monorepo-aware CLI that turns a project's accumulated changes into semver releases, a changelog, and VCS tags"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Jarvvski/momo"
readme = "README.md"
keywords = ["semver", "changelog", "release", "versioning", "monorepo"]
categories = ["command-line-utilities", "development-tools"]
# The project pins its toolchain in rust-toolchain.toml and mise.toml; this is
# the version the suite is verified against, not a hand-computed minimum.
rust-version = "1.99"
# Keep the published crate to what a `cargo install` consumer needs: planning
# notes, CI config, the logo, and the docs the README links to are not part of
# the binary.
exclude = [
  ".agents/",
  ".claude/",
  ".github/",
  ".momo/",
  ".scratch/",
  "assets/",
  "docs/",
  "AGENTS.md",
  "CLAUDE.md",
  "GLOSSARY.md",
  "mise.toml",
  "momo.toml",
  # `rust-version` already states the toolchain floor; shipping the pin would
  # make `cargo install` download a specific toolchain instead.
  "rust-toolchain.toml",
  "skills-lock.json",
]

[[bin]]
name = "momo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
semver = "1.0"
serde_json = "1.0"
thiserror = "2.0"
time = "0.3"
toml_edit = "0.25"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }

# Keep local development and test artifacts small. Release builds are used by
# the normal mise run/build tasks, while tests retain their separate profile.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
