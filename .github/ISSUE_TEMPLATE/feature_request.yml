name: Feature request
description: Something momo should do and does not.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does momo get in the way? Describe the situation, not the fix.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like momo to do
      description: Describe the behaviour, **not the key**. Tell us the situation and the outcome you want, rather than a `momo.toml` key or flag you would reach for — momo is not accepting new config keys by default, and the surface is worked out from the problem. See the option philosophy in `docs/option-philosophy.md`.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and any workaround you use today.
    validations:
      required: false
