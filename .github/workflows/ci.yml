name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A burst of pushes to one pull request only needs the newest result, so a new
# run cancels the run it supersedes rather than stacking redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is a first-class target: the crate ships macOS binaries and its
        # spawn/process code is Unix-specific, so the suite runs there too.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # A missing jj/mise must fail the run rather than skip the tests that
      # need it, so a green check means the strongest tests actually ran.
      MOMO_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Rustup components live outside mise's cached data directory.
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: mise run check

  # `rust-version` declares the MSRV, but every other leg builds with the pinned
  # toolchain in rust-toolchain.toml. This one builds with the declared floor
  # itself, so the number stays honest: raising the pin without raising
  # `rust-version` cannot strand the floor, and a dependency that lifts its own
  # MSRV past it fails here.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - name: Install the declared MSRV
        run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      # `+<msrv>` overrides the pinned rust-toolchain.toml, so this compiles with
      # the floor rather than the pin.
      - run: cargo +${{ steps.msrv.outputs.version }} check --locked --all-targets

  # Branch protection requires a status check named exactly `check`, but a
  # matrix expands the job name to `check (<os>)`. This fans the legs back in
  # under that name so the protected branch keeps its single required check.
  check-required:
    name: check
    needs: [check, msrv]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check leg to pass
        if: needs.check.result != 'success' || needs.msrv.result != 'success'
        run: exit 1

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources
